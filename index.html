<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Floating Works Space</title>

  <style>
    html, body { margin:0; height:100%; overflow:hidden; background:#0b0b16; }
   
    /* canvas fade-in */
    canvas{
      display:block;
      opacity:0;
      transition: opacity 1200ms ease;
    }
    body.revealed canvas{ opacity:1; }

    #hint{
      position:fixed; left:16px; top:16px; z-index:10;
      color:#eaeaea; font-family:system-ui, -apple-system, sans-serif;
      font-size:14px; opacity:0.85;
      background:rgba(255,255,255,0.06);
      padding:10px 12px; border-radius:12px;
      backdrop-filter: blur(8px);
      user-select:none; line-height:1.4;
    }

    #overlay{
      position:fixed; inset:0; z-index:30;
      display:none; align-items:center; justify-content:center;
      background: rgba(8, 8, 16, 0.78);
      backdrop-filter: blur(10px);
    }

    /* ✅ panel is column layout, never taller than viewport */
    #panel{
      width:min(980px, 92vw);
      max-height: 92vh;
      display:flex;
      flex-direction:column;
      border-radius:18px;
      overflow:hidden;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 20px 70px rgba(0,0,0,0.55);
      font-family: system-ui, -apple-system, sans-serif;
      color: #eaeaea;
    }

    /* media area stays content-based */
    #mediaWrap{
      background:#000;
      display:flex;
      justify-content:center;
      align-items:center;
      flex: 0 0 auto;
    }
    #mediaWrap.image-mode{
    max-height: none;
    }

    /* YouTube iframe */
    #ytFrame{
      width:100%;
      aspect-ratio: 16 / 9;
      border:0;
      display:none;
      background:#000;

        /* ✅ 추가 */
      max-height: 48vh;
    }

    /* Local video fallback */
    #workVideo{
      width:100%;
      height:auto;
      display:none;
      background:#000;

       /* ✅ 추가 */
      max-height: 48vh;
    }

  #workImage{
  display:none;
  max-width: 100%;
  max-height: 70vh;
  width: auto;
  height: auto;
  object-fit: contain;
  margin: 0 auto;
  cursor: zoom-in;
}

    /* ===== LIGHTBOX ===== */
    #lightbox{
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.95);
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #lightbox.open{ display: flex; }
    #lightboxImg{
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      cursor: zoom-out;
    }

   /* ===== TEXT AREA ===== */
#meta{
  padding: 14px 16px 18px 16px;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
  flex: 1 1 auto;

  /* 🔥 중요 (스크롤 작동) */
  min-height: 0;

  background: rgba(0,0,0,0.65);

  /* ===== Firefox ===== */
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.22) transparent;
}

/* ===== Scrollbar (Chrome / Safari / Edge) ===== */
#meta::-webkit-scrollbar{
  width: 6px;
}

#meta::-webkit-scrollbar-track{
  background: transparent;
}

#meta::-webkit-scrollbar-thumb{
  background: rgba(255,255,255,0.35); /* 🔥 항상 살짝 보이게 */
  border-radius: 999px;
}

#meta::-webkit-scrollbar-thumb:hover{
  background: rgba(255,255,255,0.45); /* hover 시 강조 */
}

    #workTitle{ margin: 0 0 6px 0; font-size: 18px; font-weight: 700; }
    #workDesc{
      margin: 0;
      font-size: 14px;
      line-height: 1.65;
      color: rgba(234,234,234,0.80);
      white-space: pre-line;
    }

    #closeBtn{
      position: fixed; right: 16px; top: 16px; z-index: 40;
      display:none;
      color:#eaeaea;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 10px 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      cursor: pointer;
      user-select:none;
      backdrop-filter: blur(8px);
    }

    /* Loader (black screen only) */
    #loader{
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity 1200ms ease, visibility 1200ms ease;
    }
    #loaderText{
      color: rgba(234,234,234,0.92);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      letter-spacing: 0.6px;
      text-align: center;
      user-select: none;
    }
    #loaderText::after{
      content: "";
      display: inline-block;
      width: 10px;
      height: 1.1em;
      margin-left: 6px;
      background: rgba(234,234,234,0.75);
      transform: translateY(2px);
      animation: blink 0.9s steps(1) infinite;
    }
    @keyframes blink{ 50%{ opacity: 0; } }

    #loader.hide{
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ===== NAV ===== */
#nav{
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 20;
  display: flex;
  gap: 10px;
}

.nav-item{
  color: #eaeaea;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 14px;
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(255,255,255,0.06);
  border: none;
  backdrop-filter: blur(8px);
  cursor: pointer;
  transition: all 0.2s ease;
}

.nav-item:hover{
  background: rgba(255,255,255,0.12);
}

  </style>
</head>

<body>
  <div id="hint">
    Drag = look (360°)<br/>
    WASD = move, Q/E = down/up<br/>
    Trackpad scroll = forward/back<br/>
    Click a card = open<br/>
    Pinch gesture = toggle card alignment
  </div>
  
  <div id="nav">
   <div class="nav-item" data-page="about">About</div>
   <div class="nav-item" data-page="contact">Contact</div>
   <div class="nav-item" data-page="cv">CV</div>
  </div>

  <div id="loader" aria-hidden="false">
    <div id="loaderText"></div>
  </div>

  <div id="overlay">
    <div id="panel">
      <div id="mediaWrap">
        <!-- YouTube -->
        <iframe
          id="ytFrame"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>

        <!-- Local video (optional fallback) -->
        <video
          id="workVideo"
          controls
          playsinline
          webkit-playsinline
          preload="metadata"
          controlsList="nodownload noplaybackrate noremoteplayback"
          disablePictureInPicture
        ></video>

        <img id="workImage" alt="" draggable="false" />
      </div>

      <div id="meta">
        <h2 id="workTitle"></h2>
        <p id="workDesc"></p>
      </div>
    </div>
  </div>

  <div id="closeBtn">Close (Esc)</div>

  <div id="lightbox">
    <img id="lightboxImg" alt="" draggable="false" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    // ================= Loader helpers =================
    const loader = document.getElementById("loader");
    const loaderTextEl = document.getElementById("loaderText");
    const LOADER_LINE = "Now you’re entering my mindspace...";

    function hideLoader() {
      if (!loader) return;
      loader.classList.add("hide");
      setTimeout(() => loader.remove(), 1400);
    }

    function typeText(el, text, speed = 90) {
      return new Promise((resolve) => {
        if (!el) return resolve();
        el.textContent = "";
        let i = 0;
        const tick = () => {
          el.textContent = text.slice(0, i);
          i++;
          if (i <= text.length) setTimeout(tick, speed);
          else resolve();
        };
        tick();
      });
    }

    // -------- Overlay UI --------
    const overlay = document.getElementById("overlay");
    const closeBtn = document.getElementById("closeBtn");
    const workVideo = document.getElementById("workVideo");
    const ytFrame = document.getElementById("ytFrame");
    const workImage = document.getElementById("workImage");
    const workTitle = document.getElementById("workTitle");
    const workDesc  = document.getElementById("workDesc");
    const metaEl    = document.getElementById("meta");
    const PINCH_ON_THRESHOLD = 0.045;
    const PINCH_OFF_THRESHOLD = 0.07;
    

   // ===== NAV (여기에 넣기) =====
   const navItems = document.querySelectorAll(".nav-item");

   navItems.forEach(item => {
     item.addEventListener("click", () => {
       const page = item.dataset.page;

       resetMedia();

       if(page === "about"){
  workTitle.textContent = "About";
  workDesc.textContent =
    "Seonjoo Lee is a multimedia creator with a background in fashion communication, digital image-making, and interactive media.\n\nHer practice explores how perception is shaped through computational systems, often blurring the boundary between the natural and the artificial.\n\nWorking with bodily signals, gesture, and interaction, she creates systems where human input and machine processes continuously influence one another.\n\nThrough moving image and interactive environments, she investigates how technology mediates the way we sense, interpret, and experience the world.";
}

       if(page === "contact"){
       workTitle.textContent = "Contact";
       workDesc.innerHTML =
        '<a href="mailto:contact@cuteerrormachine.com" style="color:#eaeaea;">contact@cuteerrormachine.com</a>';
    }

       if(page === "cv"){
       workTitle.textContent = "";
       workDesc.textContent = "";
       workImage.src = "assets/images/SEONJOO_LEE_Resume.png";
       workImage.style.display = "block";
       workImage.style.maxHeight = "90vh";
       metaEl.style.display = "none";
       document.getElementById("mediaWrap").classList.add("image-mode");
    }

    overlay.style.display = "flex";
    closeBtn.style.display = "block";
    isOverlayOpen = true;

    if (metaEl) metaEl.scrollTop = 0;
  });
});
    workVideo.addEventListener("contextmenu", (e) => e.preventDefault());
    workImage.addEventListener("contextmenu", (e) => e.preventDefault());

    // ===== LIGHTBOX =====
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");

    workImage.addEventListener("click", () => {
      if (!workImage.src) return;
      lightboxImg.src = workImage.src;
      lightbox.classList.add("open");
    });

    lightbox.addEventListener("click", () => {
      lightbox.classList.remove("open");
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && lightbox.classList.contains("open")) {
        lightbox.classList.remove("open");
      }
    });

    let isOverlayOpen = false;
    let focusedCard = null;
    let isPinching = false;
    let handTrackingActive = false;
    let hands = null;
    let mpCamera = null;
    let webcamVideo = null;
    let mainCanvas = null;
    let pinchDistanceSmoothed = 0.12;
    let missingHandFrames = 0;
    let pinchOnFrames = 0;
    let pinchOffFrames = 0;
    let wasPinching = false;
    let isAlignedLocked = false;

    function resetMedia() {
      // local video
      try { workVideo.pause(); } catch(e){}
      workVideo.removeAttribute("src");
      workVideo.load();
      workVideo.style.display = "none";

      // youtube
      ytFrame.removeAttribute("src");
      ytFrame.style.display = "none";

      // image
      workImage.removeAttribute("src");
      workImage.style.display = "none";
    }

    // ✅ accepts either full URL or just ID
    function getYouTubeId(input) {
      if (!input) return null;
      const s = String(input).trim();

      // Already an ID (11 chars)
      if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;

      try {
        const u = new URL(s);
        const host = u.hostname.replace("www.", "");
        if (host === "youtu.be") return u.pathname.replace("/", "").slice(0, 11);

        if (host.includes("youtube.com")) {
          const v = u.searchParams.get("v");
          if (v) return v.slice(0, 11);

          const m = u.pathname.match(/\/shorts\/([a-zA-Z0-9_-]{11})/);
          if (m) return m[1];

          const e = u.pathname.match(/\/embed\/([a-zA-Z0-9_-]{11})/);
          if (e) return e[1];
        }
      } catch (e) {}
      return null;
    }

    function toYouTubeEmbed(input) {
      const id = getYouTubeId(input);
      if (!id) return "";
      return "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0&modestbranding=1";
    }

const mediaWrap = document.getElementById("mediaWrap"); // ← 함수 밖에 1번 선언

function openWork(card) {
  const work = card.userData.work;

  workTitle.textContent = work.title || "";
  workDesc.textContent  = work.description || "";

  resetMedia();

  // 🔥 image-mode 초기화
  mediaWrap.classList.remove("image-mode");

  if (work.type === "image") {
    workImage.src = work.src;
    workImage.style.display = "block";

    // 🔥 이미지일 때만 적용
    mediaWrap.classList.add("image-mode");

  } else {
    const ytId = getYouTubeId(work.youtube);

    if (ytId) {
      ytFrame.src = toYouTubeEmbed(ytId);
      ytFrame.style.display = "block";

    } else {
      workVideo.src = work.src;
      workVideo.currentTime = 0;
      workVideo.style.display = "block";

      // 🔥 다운로드 방지 옵션 (B에서 가져옴)
      workVideo.setAttribute("controlsList", "nodownload noplaybackrate noremoteplayback");
      workVideo.setAttribute("disablePictureInPicture", "");

      workVideo.play().catch(()=>{});
    }
  }

  overlay.style.display = "flex";
  closeBtn.style.display = "block";
  isOverlayOpen = true;

  if (metaEl) metaEl.scrollTop = 0;
}

      // ✅ scroll text to top each time
      if (metaEl) metaEl.scrollTop = 0;
    

    function closeOverlay() {
      overlay.style.display = "none";
      closeBtn.style.display = "none";
      isOverlayOpen = false;
      resetMedia();
      focusedCard = null;
      metaEl.style.display = "";
      workImage.style.maxHeight = "";
      document.getElementById("mediaWrap").classList.remove("image-mode");
      lightbox.classList.remove("open");
      requestAnimationFrame(() => mainCanvas?.focus?.());
    }

    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeOverlay();
    });
    closeBtn.addEventListener("click", closeOverlay);
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && isOverlayOpen && !lightbox.classList.contains("open")) closeOverlay();
    });

    // -------- Fallback title texture --------
    function makeTitleTexture(title) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 288;
      const ctx = c.getContext("2d");

      const grad = ctx.createLinearGradient(0, 0, c.width, c.height);
      grad.addColorStop(0, "rgba(25,25,40,1)");
      grad.addColorStop(1, "rgba(5,5,10,1)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, c.width, c.height);

      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fillRect(0, 0, c.width, 70);

      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.font = "700 26px system-ui, -apple-system, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";

      const pad = 22;
      ctx.fillText(title || "Untitled", pad, c.height * 0.55);

      ctx.fillStyle = "rgba(255,255,255,0.55)";
      ctx.font = "500 13px system-ui, -apple-system, sans-serif";
      ctx.fillText("Click to open", pad, c.height - 20);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // -------- MAIN INIT --------
    (async function init(){
      // 0) typing first
      await typeText(loaderTextEl, LOADER_LINE, 90);

      // 1) Load manifest (root manifest.json)
      let manifest;
      try {
        const res = await fetch("manifest.json", { cache: "no-store" });
        if (!res.ok) throw new Error("manifest fetch failed: " + res.status);
        manifest = await res.json();
      } catch (err) {
        alert("Can't read manifest.json. Check path / JSON syntax.");
        console.error(err);
        return;
      }

      const priority = Array.isArray(manifest.priority) ? manifest.priority : [];
      const items    = Array.isArray(manifest.items) ? manifest.items : [];

      // 2) Build works array
      const works = items.map(it => {
        const type = (it.type || "video").toLowerCase();
        const file = it.file || "";
        const youtube = it.youtube || null;
        const youtubeId = getYouTubeId(youtube);

        const isImage = (type === "image");
        const src = isImage ? ("assets/images/" + file) : ("assets/videos/" + file);
        const thumb = it.thumb
          ? (/^https?:\/\//.test(it.thumb) ? it.thumb : ("assets/thumbs/" + it.thumb))
          : (youtubeId ? ("https://img.youtube.com/vi/" + youtubeId + "/hqdefault.jpg") : null);

        return {
          id: it.id,
          type: isImage ? "image" : "video",
          title: it.title || it.id,
          description: it.description || "",
          youtube: youtube,
          src: src,
          thumb: thumb
        };
      }).filter(w => w.id && (w.type === "image" ? !!w.src : (!!w.youtube || !!w.src)));

      if (!works.length) {
        alert("manifest items is empty. Check manifest.json content.");
        return;
      }

      // priority index
      const prIndex = new Map(priority.map((id, i) => [id, i]));

      // priorityWorks / otherWorks
      const priorityWorks = [];
      const otherWorks = [];
      for (const w of works) {
        if (prIndex.has(w.id)) priorityWorks.push(w);
        else otherWorks.push(w);
      }
      priorityWorks.sort((a,b) => prIndex.get(a.id) - prIndex.get(b.id));

      // 3) Scene
      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x0b0b16, 15, 180);

      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 600);
      camera.position.set(0, 0, 35);

      const renderer = new THREE.WebGLRenderer({ antialias:true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.domElement.tabIndex = 0;
      renderer.domElement.style.outline = "none";
      document.body.appendChild(renderer.domElement);
      mainCanvas = renderer.domElement;

      scene.add(new THREE.AmbientLight(0xffffff, 1));

      // placement parameters
      const CARD_COUNT    = Math.max(works.length, 90);

      const FRONT_Z       = 15;
      const FRONT_SPREAD  = 20;
      const INNER_R       = 25;
      const OUTER_R       = 60;
      const MIN_CAM_DIST  = 12;

      function randomInShell(r1, r2) {
        const a = Math.min(r1, r2);
        const b = Math.max(r1, r2);

        const u = Math.random();
        const r = Math.cbrt((b**3 - a**3) * u + a**3);

        const theta = Math.random() * Math.PI * 2;
        const v = Math.random() * 2 - 1;
        const phi = Math.acos(v);

        return new THREE.Vector3(
          r * Math.sin(phi) * Math.cos(theta),
          r * Math.cos(phi),
          r * Math.sin(phi) * Math.sin(theta)
        );
      }

      function safeRandomPos() {
        for (let tries = 0; tries < 60; tries++) {
          const p = randomInShell(INNER_R, OUTER_R);
          const d = camera.position.distanceTo(p);
          if (d > MIN_CAM_DIST && p.z < (camera.position.z - 2)) return p;
        }
        return new THREE.Vector3(
          (Math.random()*2-1) * OUTER_R,
          (Math.random()*2-1) * OUTER_R * 0.6,
          0
        );
      }

      const texLoader = new THREE.TextureLoader();
      texLoader.setCrossOrigin("anonymous");

      function createMaterial(work){
        const mat = new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 1,
          depthWrite: false,
          color: new THREE.Color(1,1,1)
        });

        if (work.thumb) {
          texLoader.load(
            work.thumb,
            (tex) => {
              tex.colorSpace = THREE.SRGBColorSpace;
              mat.map = tex;
              mat.needsUpdate = true;
            },
            undefined,
            () => {
              mat.map = makeTitleTexture(work.title);
              mat.needsUpdate = true;
            }
          );
        } else {
          mat.map = makeTitleTexture(work.title);
        }
        return mat;
      }

     // 4) Cards
const cards = [];
const alignCards = [];
let maxCardWidth = 0;
let maxCardHeight = 0;
let alignedCardScale = 1;
const ALIGN_SCALE_BOOST = 1.22;

const FRONT_MIX_EXTRA = Math.min(10, otherWorks.length);

// ❌ const 삭제하고 let만 사용
let orderedWorks = priorityWorks.concat(otherWorks);

// Keep the newest featured video first, then CEM and Outside² nearby.
for (const featuredId of ["stzs77hykka", "cem", "outside2"].reverse()) {
  const featuredIndex = orderedWorks.findIndex(
    w => w.id.toLowerCase() === featuredId
  );

  if (featuredIndex > -1) {
    const [featured] = orderedWorks.splice(featuredIndex, 1);
    orderedWorks.unshift(featured);
  }
}

      // ✅ 앞에 확정 배치할 개수(=priority 전부 + extra 몇 개)
      const frontCount = Math.min(priorityWorks.length + FRONT_MIX_EXTRA, orderedWorks.length);

      function pickRandomWork() {
        const p = Math.random();
        if (priorityWorks.length && p < 0.35) {
          return priorityWorks[(Math.random() * priorityWorks.length) | 0];
        }
        return orderedWorks[(Math.random() * orderedWorks.length) | 0];
      }

      function frontPos(index){
        if (index === 0) return new THREE.Vector3(-8.2, 0, FRONT_Z + 7);
        if (index === 1) return new THREE.Vector3(0, 0, FRONT_Z + 7);
        if (index === 2) return new THREE.Vector3(8.2, 0, FRONT_Z + 7);

        const ang = index * 1.15;
        const rad = 3 + index * 1.3;
        const jx = (Math.random() * 2 - 1) * 3.8;
        const jy = (Math.random() * 2 - 1) * 2.8;
        const jz = (Math.random() * 2 - 1) * 2.2;

        const x = Math.cos(ang) * rad + jx;
        const y = Math.sin(ang * 0.9) * (rad * 0.45) + jy;
        const z = FRONT_Z + jz;

        const cx = THREE.MathUtils.clamp(x, -FRONT_SPREAD, FRONT_SPREAD);
        const cy = THREE.MathUtils.clamp(y, -FRONT_SPREAD * 0.6, FRONT_SPREAD * 0.6);
        return new THREE.Vector3(cx, cy, z);
      }

      for (let i = 0; i < CARD_COUNT; i++){
        // ✅ 1) orderedWorks 전체를 먼저 한 번씩 생성
        // ✅ 2) 남는 카드만 랜덤으로 채움
        const work = (i < orderedWorks.length) ? orderedWorks[i] : pickRandomWork();
        const mat  = createMaterial(work);

        const w = 6.5 + Math.random() * 6.5;
        const h = w * (9/16);
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
        maxCardWidth = Math.max(maxCardWidth, w);
        maxCardHeight = Math.max(maxCardHeight, h);

        // ✅ frontCount까지는 앞쪽 배치, 그 이후는 랜덤
        const p = (i < frontCount) ? frontPos(i) : safeRandomPos();
        mesh.position.copy(p);

        const isPriority = prIndex.has(work.id);
        const rank = isPriority ? prIndex.get(work.id) : 9999;

        mesh.userData.work = work;
        mesh.userData.isPriority = isPriority;
        mesh.userData.prRank = rank;

        mesh.userData.base = p.clone();
        mesh.userData.target = p.clone();
        mesh.userData.vel = new THREE.Vector3();
        mesh.userData.seed = Math.random() * 1000;

        scene.add(mesh);
        cards.push(mesh);
      }

      const seenWorkIds = new Set();
      for (const m of cards) {
        const workId = m.userData.work?.id || "";
        if (!seenWorkIds.has(workId)) {
          seenWorkIds.add(workId);
          m.userData.isAlignDuplicate = false;
          alignCards.push(m);
        } else {
          m.userData.isAlignDuplicate = true;
        }
      }

      function setLineAlignedTargets() {
        const count = alignCards.length;
        if (!count) return;

        const cols = Math.max(7, Math.min(16, Math.ceil(Math.sqrt(count * 1.2))));
        const rows = Math.ceil(count / cols);
        const distance = 30;

        const baseXSpacing = Math.max(7.4, maxCardWidth * 1.08);
        const baseYSpacing = Math.max(4.4, maxCardHeight * 1.12);

        // Fit all cards inside current camera frustum at align distance.
        const vFov = THREE.MathUtils.degToRad(camera.fov);
        const viewHeight = 2 * Math.tan(vFov * 0.5) * distance;
        const viewWidth = viewHeight * camera.aspect;

        const rawGridWidth = (cols - 1) * baseXSpacing + maxCardWidth;
        const rawGridHeight = (rows - 1) * baseYSpacing + maxCardHeight;
        const fitScale = Math.min(
          (viewWidth * 0.9) / Math.max(rawGridWidth, 0.0001),
          (viewHeight * 0.86) / Math.max(rawGridHeight, 0.0001),
          1
        );
        const boostedScale = fitScale * ALIGN_SCALE_BOOST;
        const safeMaxScale = Math.min(
          (viewWidth * 0.82) / Math.max(rawGridWidth, 0.0001),
          (viewHeight * 0.8) / Math.max(rawGridHeight, 0.0001),
          1.22
        );
        alignedCardScale = THREE.MathUtils.clamp(Math.min(boostedScale, safeMaxScale), 0.34, 1.22);

        const xSpacing = baseXSpacing * alignedCardScale;
        const ySpacing = baseYSpacing * alignedCardScale;

        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
        const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
        const center = camera.position.clone().add(forward.multiplyScalar(distance));

        // Fill center slots first, so priority cards occupy the visual center.
        const centerFirstSlots = [];
        const cx = (cols - 1) * 0.5;
        const cy = (rows - 1) * 0.5;
        const featuredRow = Math.max(0, Math.min(rows - 1, Math.round(cy)));
        const featuredCenterCol = Math.max(0, Math.min(cols - 1, Math.round(cx)));
        const featuredSlotIndexes = new Set(
          [featuredCenterCol - 1, featuredCenterCol, featuredCenterCol + 1]
            .filter(col => col >= 0 && col < cols)
            .map(col => featuredRow * cols + col)
        );

        for (const index of featuredSlotIndexes) {
          if (index < count) {
            const col = index % cols;
            const row = Math.floor(index / cols);
            centerFirstSlots.push({ index, col, row, dist2: 0 });
          }
        }

        for (let i = 0; i < count; i++) {
          if (featuredSlotIndexes.has(i)) continue;
          const col = i % cols;
          const row = Math.floor(i / cols);
          const dist2 = (col - cx) * (col - cx) + (row - cy) * (row - cy);
          centerFirstSlots.push({ index: i, col, row, dist2 });
        }
        centerFirstSlots.sort((a, b) => a.dist2 - b.dist2);

        // CEM highest priority, then video works, then others.
        const alignOrdered = alignCards.slice().sort((a, b) => {
          const aWork = a.userData.work || {};
          const bWork = b.userData.work || {};
          const aIsNewVideo = String(aWork.id || "").toLowerCase() === "stzs77hykka";
          const bIsNewVideo = String(bWork.id || "").toLowerCase() === "stzs77hykka";
          if (aIsNewVideo !== bIsNewVideo) return aIsNewVideo ? -1 : 1;

          const aIsCem = String(aWork.id || "").toLowerCase() === "cem";
          const bIsCem = String(bWork.id || "").toLowerCase() === "cem";
          if (aIsCem !== bIsCem) return aIsCem ? -1 : 1;

          const aIsOutside = String(aWork.id || "").toLowerCase() === "outside2";
          const bIsOutside = String(bWork.id || "").toLowerCase() === "outside2";
          if (aIsOutside !== bIsOutside) return aIsOutside ? -1 : 1;

          const aIsVideo = aWork.type === "video";
          const bIsVideo = bWork.type === "video";
          if (aIsVideo !== bIsVideo) return aIsVideo ? -1 : 1;

          return (aWork.prRank ?? 9999) - (bWork.prRank ?? 9999);
        });

        for (let i = 0; i < count; i++) {
          const slot = centerFirstSlots[i];
          const col = slot.col;
          const row = slot.row;
          const colOffset = (col - (cols - 1) * 0.5) * xSpacing;
          const rowOffset = ((rows - 1) * 0.5 - row) * ySpacing;

          const target = center.clone()
            .add(right.clone().multiplyScalar(colOffset))
            .add(up.clone().multiplyScalar(rowOffset));
          alignOrdered[i].userData.target.copy(target);
        }
      }

      function updatePinchState(results) {
        const MISS_FRAME_TOLERANCE = 8;
        const ON_HOLD_FRAMES = 3;
        const OFF_HOLD_FRAMES = 5;
        const hand = results?.multiHandLandmarks?.[0];
        if (hand) {
          missingHandFrames = 0;
          const thumbTip = hand[4];
          const indexTip = hand[8];
          if (thumbTip && indexTip) {
            const dx = thumbTip.x - indexTip.x;
            const dy = thumbTip.y - indexTip.y;
            // 2D screen-space distance is usually more stable than z-inclusive distance.
            const dist = Math.sqrt(dx * dx + dy * dy);
            pinchDistanceSmoothed = THREE.MathUtils.lerp(pinchDistanceSmoothed, dist, 0.35);

            // Hysteresis: tighter threshold to enter pinch, looser to exit.
            if (pinchDistanceSmoothed <= PINCH_ON_THRESHOLD) {
              pinchOnFrames += 1;
              pinchOffFrames = 0;
              if (!isPinching && pinchOnFrames >= ON_HOLD_FRAMES) isPinching = true;
            } else if (pinchDistanceSmoothed >= PINCH_OFF_THRESHOLD) {
              pinchOffFrames += 1;
              pinchOnFrames = 0;
              if (isPinching && pinchOffFrames >= OFF_HOLD_FRAMES) isPinching = false;
            }
          }
          return;
        }

        missingHandFrames += 1;
        if (missingHandFrames > MISS_FRAME_TOLERANCE) {
          isPinching = false;
          pinchOnFrames = 0;
          pinchOffFrames = 0;
        }
      }

      async function initHandTracking() {
        if (!window.Hands || !window.Camera) return;

        webcamVideo = document.createElement("video");
        webcamVideo.setAttribute("playsinline", "");
        webcamVideo.setAttribute("muted", "");
        webcamVideo.muted = true;
        webcamVideo.autoplay = true;
        webcamVideo.width = 640;
        webcamVideo.height = 480;
        webcamVideo.style.position = "fixed";
        webcamVideo.style.left = "-9999px";
        webcamVideo.style.width = "1px";
        webcamVideo.style.height = "1px";
        webcamVideo.style.opacity = "0";
        webcamVideo.style.pointerEvents = "none";
        document.body.appendChild(webcamVideo);

        hands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.5
        });
        hands.onResults(updatePinchState);

        mpCamera = new Camera(webcamVideo, {
          onFrame: async () => {
            if (!hands) return;
            await hands.send({ image: webcamVideo });
          },
          width: 640,
          height: 480
        });

        try {
          await mpCamera.start();
          handTrackingActive = true;
        } catch (err) {
          handTrackingActive = false;
          console.warn("Webcam permission denied or unavailable:", err);
        }
      }

      document.body.classList.add("revealed");
      setTimeout(hideLoader, 700);
      initHandTracking();

      // 5) Look control (drag)
      let yaw = 0, pitch = 0;
      let dragging = false;
      let lastX = 0, lastY = 0;
      let moved = 0;
      const LOOK_SENS = 0.004;

      renderer.domElement.addEventListener("pointerdown", (e) => {
        if (isOverlayOpen) return;
        renderer.domElement.focus();
        dragging = true;
        moved = 0;
        lastX = e.clientX;
        lastY = e.clientY;
      });
      window.addEventListener("pointerup", () => dragging = false);

      window.addEventListener("pointermove", (e) => {
        if (isOverlayOpen) return;
        if (!dragging) return;

        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;

        moved += Math.abs(dx) + Math.abs(dy);

        yaw   -= dx * LOOK_SENS;
        pitch -= dy * LOOK_SENS;

        const limit = Math.PI / 2 - 0.05;
        pitch = Math.max(-limit, Math.min(limit, pitch));
      });

      // 6) Movement + trackpad scroll
      const keys = new Set();
      const codes = new Set();
      const onKeyDown = (e) => {
        keys.add((e.key || "").toLowerCase());
        codes.add(e.code || "");
      };
      const onKeyUp = (e) => {
        keys.delete((e.key || "").toLowerCase());
        codes.delete(e.code || "");
      };
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("keyup", onKeyUp);
      document.addEventListener("keydown", onKeyDown);
      document.addEventListener("keyup", onKeyUp);
      window.addEventListener("blur", () => { keys.clear(); codes.clear(); });

      function isPressed(charKey, codeKey) {
        return keys.has(charKey) || codes.has(codeKey);
      }

      let baseSpeed = 0.15;
      let scrollVel = 0;
      const SCROLL_SENS = 0.0016;
      const SCROLL_DAMP = 0.86;

      window.addEventListener("wheel", (e) => {
        if (isOverlayOpen) return;
        scrollVel += (-e.deltaY) * SCROLL_SENS;
        e.preventDefault();
      }, { passive:false });

      function updateMovement(){
        if (isOverlayOpen) return;

        const fast = keys.has("shift") || codes.has("ShiftLeft") || codes.has("ShiftRight") ? 2.0 : 1.0;
        const speed = baseSpeed * fast;

        const forward = new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(pitch, yaw, 0, "YXZ"));
        const right   = new THREE.Vector3(1,0,0).applyEuler(new THREE.Euler(0, yaw, 0, "YXZ"));
        const up      = new THREE.Vector3(0,1,0);

        const v = new THREE.Vector3();
        if (isPressed("w", "KeyW")) v.add(forward);
        if (isPressed("s", "KeyS")) v.sub(forward);
        if (isPressed("d", "KeyD")) v.add(right);
        if (isPressed("a", "KeyA")) v.sub(right);
        if (isPressed("e", "KeyE")) v.add(up);
        if (isPressed("q", "KeyQ")) v.sub(up);

        if (v.lengthSq() > 0){
          v.normalize().multiplyScalar(speed);
          camera.position.add(v);
        }

        if (Math.abs(scrollVel) > 0.00001) {
          camera.position.add(forward.clone().multiplyScalar(scrollVel));
          scrollVel *= SCROLL_DAMP;
        } else scrollVel = 0;
      }

      // 7) Click (raycaster)
      const raycaster = new THREE.Raycaster();
      const mouseNDC = new THREE.Vector2();

      function getHits(clientX, clientY){
        const rect = renderer.domElement.getBoundingClientRect();
        mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        mouseNDC.y = -(((clientY - rect.top) / rect.height) * 2 - 1);
        raycaster.setFromCamera(mouseNDC, camera);
        return raycaster.intersectObjects(cards, false);
      }

      renderer.domElement.addEventListener("click", (e) => {
        if (isOverlayOpen) return;
        if (moved > 6) return;
        const hits = getHits(e.clientX, e.clientY);
        if (!hits.length) return;
        openWork(hits[0].object);
      });

      // 8) Hover
      const pointer = { x: 0, y: 0 };
      let hoverCard = null;

      window.addEventListener("pointermove", (e) => {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
      });

      function updateHover(){
        if (isOverlayOpen) { hoverCard = null; return; }
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(cards, false);
        hoverCard = hits.length ? hits[0].object : null;
      }

      // 9) Animate
      const camForward = new THREE.Vector3();
      let wasAligning = false;

      function animate(){
        requestAnimationFrame(animate);

        camera.rotation.set(pitch, yaw, 0, "YXZ");
        updateMovement();
        updateHover();

        camera.getWorldDirection(camForward);
        const t = performance.now() * 0.001;
        if (isPinching && !wasPinching) {
          // Pinch acts as a toggle: keep alignment after hand opens.
          isAlignedLocked = !isAlignedLocked;
        }
        wasPinching = isPinching;

        const isAligning = isAlignedLocked && !isOverlayOpen;

        if (isAligning) {
          setLineAlignedTargets();
        }

        if (isAligning !== wasAligning) {
          for (const m of cards) {
            m.userData.vel.multiplyScalar(0.2);
          }
          wasAligning = isAligning;
        }

        for (const m of cards){
          if (isAligning && m.userData.isAlignDuplicate) {
            m.visible = false;
            continue;
          } else {
            m.visible = true;
          }

          const s = m.userData.seed;
          const base = m.userData.base;

          if (!isAligning) {
            // drift around base position
            const x = base.x + Math.sin(t * 0.7 + s) * 0.45;
            const y = base.y + Math.cos(t * 0.6 + s) * 0.38;
            const z = base.z + Math.sin(t * 0.5 + s) * 0.30;
            m.userData.target.set(x, y, z);
          }

          const damping = isAligning ? 0.78 : 0.86;
          const pullStrength = isAligning ? 0.16 : 0.06;
          m.userData.vel.multiplyScalar(damping);
          m.userData.vel.add(m.userData.target.clone().sub(m.position).multiplyScalar(pullStrength));
          if (isAligning && m.userData.vel.lengthSq() > 1.2 * 1.2) {
            m.userData.vel.setLength(1.2);
          }
          m.position.add(m.userData.vel);
          if (isAligning && m.position.distanceToSquared(m.userData.target) < 0.02) {
            m.position.copy(m.userData.target);
            m.userData.vel.set(0, 0, 0);
          }

          const isHover = (hoverCard === m);

          if (focusedCard === m){
            const focusPos = camera.position.clone()
              .add(camForward.clone().multiplyScalar(9))
              .add(new THREE.Vector3(1.2, -0.6, 0));

            m.position.lerp(focusPos, 0.12);
            m.scale.lerp(new THREE.Vector3(1.9,1.9,1.9), 0.12);

            m.material.opacity = 1.0;
            m.material.color.setScalar(1.0);
          } else {
            if (isAligning) {
              m.scale.lerp(new THREE.Vector3(alignedCardScale, alignedCardScale, alignedCardScale), 0.18);
            } else {
              m.scale.lerp(isHover ? new THREE.Vector3(1.12,1.12,1.12) : new THREE.Vector3(1,1,1), 0.10);
            }

            const dist = camera.position.distanceTo(m.position);
            let fade = (dist - 25) / (150 - 25);
            fade = THREE.MathUtils.clamp(fade, 0, 1);

            const overlayDim = isOverlayOpen ? 0.55 : 1.0;
            const isPriority = !!m.userData.isPriority;

            const near = THREE.MathUtils.clamp(1.0 - (dist - 12) / 22, 0, 1);

            const priorityOpacityMul = isPriority ? 1.0 : THREE.MathUtils.lerp(0.18, 1.0, near);
            const priorityBrightMul  = isPriority ? 1.0 : THREE.MathUtils.lerp(0.50, 1.0, near);

            if (isAligning) {
              // In aligned mode keep all cards readable with uniform brightness.
              m.material.opacity = 1.0;
              m.material.color.setScalar(1.0);
            } else {
              m.material.opacity = THREE.MathUtils.lerp(0.98, 0.08, fade) * overlayDim * priorityOpacityMul;

              const baseBright = THREE.MathUtils.lerp(1.0, 0.45, fade) * overlayDim * priorityBrightMul;
              const bright = isHover ? Math.min(1.15, baseBright + 0.25) : baseBright;
              m.material.color.setScalar(bright);
            }
          }

          if (isAligning) {
            // Keep cards front-facing and parallel to the screen plane.
            m.quaternion.slerp(camera.quaternion, 0.22);
          } else {
            m.lookAt(camera.position);
          }
        }

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      console.log("Loaded works:", works.length, "priority:", priority);
      console.log("Ordered works:", orderedWorks.map(w => w.id));
    })();
  </script>
</body>
</html>
